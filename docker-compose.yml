version: '3.8'

services:
  bot:
    build: .
    container_name: ingestor_bot
    restart: always
    env_file:
      - .env
    environment:
      - TELEGRAM_API_SERVER=http://telegram-bot-api:8081
    volumes:
      - ./media:/app/media
      - ./data:/app/data
      - ./logs:/app/logs
      # IMPORTANTE: Compartilha o volume do servidor local para que o bot possa ler os arquivos que o servidor baixou
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: always
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    ports:
      - "8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
